<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex">
<title>Apex Convoy - live ride tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0f172a;--green:#22c55e;--cyan:#06b6d4;--amber:#f59e0b;--red:#ef4444;--gold:#facc15;--text:#e2e8f0;--dim:#8b9bb4;--line:rgba(6,182,212,.38)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#map{position:absolute;inset:0}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.55)}
.card{position:absolute;left:10px;right:10px;z-index:500;background:rgba(15,23,42,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(2,6,23,.6)}
#head{top:calc(env(safe-area-inset-top,0px) + 10px);padding:12px 14px;display:flex;align-items:center;gap:12px}
#head h1{margin:0;font-size:17px;line-height:1.2}
#head small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.st{margin-left:auto;flex:none;font:700 11px system-ui;letter-spacing:.1em;padding:4px 8px;border-radius:6px;border:1px solid}
.st.live{color:var(--green);border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.12)}
.st.ended{color:var(--dim);border-color:rgba(148,163,184,.4)}
#panel{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-height:46vh;overflow:auto;padding:10px 14px}
#panel h2{margin:6px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--dim)}
.rr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(6,182,212,.15)}
.rr:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--cyan)}
.rr.lead .dot{background:var(--gold)}
.rr.old .dot{background:var(--dim)}
.rr.sos{background:rgba(239,68,68,.15);border-radius:8px;padding:8px}
.rr b{display:block;font-size:15px}
.rr small{color:var(--dim);font-size:12px}
.rr .bt{margin-left:auto;text-align:right;font:13px ui-monospace,monospace}
.bt.low{color:var(--amber)}.bt.crit{color:var(--red)}
.cp{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.cp span:last-child{color:var(--green);font-family:ui-monospace,monospace;font-size:13px}
.note{color:var(--dim);font-size:12px;margin:8px 0 2px}
#msg{position:absolute;inset:0;display:grid;place-items:center;z-index:600;text-align:center;padding:24px;background:var(--bg)}
.pin{width:18px;height:18px;border-radius:50%;border:3px solid #0f172a;box-shadow:0 0 10px var(--c);background:var(--c)}
.pl{font:700 11px system-ui;padding:1px 6px;border-radius:4px;background:rgba(15,23,42,.92);border:1px solid var(--c);color:#fff;white-space:nowrap;transform:translate(-50%,4px);position:absolute;left:9px;top:16px}
</style>
</head>
<body>
<div id="map"></div>
<div class="card" id="head"><div><h1 id="title">Loading ride...</h1><small id="sub"></small></div><span class="st live" id="state">LIVE</span></div>
<div class="card" id="panel"><h2>RIDERS</h2><div id="riders"></div><div id="cpBox"></div><div class="note" id="upd"></div></div>
<div id="msg" style="display:none"></div>
<script>
'use strict';
/* Read-only family tracking page. No login, no app. Reads only
   /track/{token} through the Firebase REST API (public read on that one path). */
var DB_URL = 'https://apex-convoy-cloud-default-rtdb.asia-southeast1.firebasedatabase.app';
var tok = new URLSearchParams(location.search).get('t') || '';
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
function ago(ts) { var s = Math.max(0, (Date.now() - ts) / 1000); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return Math.floor(s / 86400) + ' d ago'; }
function hm(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function fail(t) { var m = document.getElementById('msg'); m.style.display = 'grid'; m.innerHTML = '<div><h2 style="margin:0 0 8px">Apex Convoy</h2><p style="color:#8b9bb4;max-width:320px">' + esc(t) + '</p></div>'; }
if (!/^[a-z0-9]{10,40}$/.test(tok)) fail('This tracking link is incomplete. Ask the rider to share it again.');
else {
  var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20, 78], 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  var routeLine = null, markers = {}, fitted = false, wpLayer = L.layerGroup().addTo(map);
  function icon(name, color) { return L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div style="position:relative;--c:' + color + '"><div class="pin"></div><div class="pl">' + esc(name) + '</div></div>' }); }
  function draw(d) {
    if (!d) { fail('This ride could not be found. The link may have expired.'); return; }
    var m = d.m || {}, rs = d.r || {}, cp = d.cp || {};
    document.getElementById('title').textContent = m.title || 'Group ride';
    document.getElementById('sub').textContent = [m.from && m.to ? m.from + ' to ' + m.to : '', m.leader ? 'Led by ' + m.leader : ''].filter(Boolean).join(' \u00b7 ');
    var st = document.getElementById('state'); var open = m.open !== false;
    st.textContent = open ? 'LIVE' : 'ENDED'; st.className = 'st ' + (open ? 'live' : 'ended');
    if (Array.isArray(m.route) && m.route.length >= 4 && !routeLine) {
      var pts = []; for (var i = 0; i + 1 < m.route.length; i += 2) pts.push([m.route[i], m.route[i + 1]]);
      routeLine = L.polyline(pts, { color: '#f59e0b', weight: 4, opacity: .85 }).addTo(map);
      (m.wp || []).forEach(function (w) { L.circleMarker([w.la, w.ln], { radius: 6, color: '#f59e0b', fillOpacity: .8 }).bindTooltip(esc(w.l)).addTo(wpLayer); });
    }
    var list = Object.keys(rs).map(function (k) { var r = rs[k]; r.k = k; return r; }).filter(function (r) { return r && r.la != null && Date.now() - (r.at || 0) < 12 * 3600000; })
      .sort(function (a, b) { return (b.l ? 1 : 0) - (a.l ? 1 : 0) || (b.at || 0) - (a.at || 0); });
    var bounds = [];
    list.forEach(function (r) {
      var old = Date.now() - r.at > 5 * 60000, color = r.sos ? '#ef4444' : r.l ? '#facc15' : old ? '#8b9bb4' : '#06b6d4';
      if (!markers[r.k]) markers[r.k] = L.marker([r.la, r.ln], { icon: icon(r.n, color) }).addTo(map);
      else { markers[r.k].setLatLng([r.la, r.ln]); markers[r.k].setIcon(icon(r.n, color)); }
      bounds.push([r.la, r.ln]);
    });
    document.getElementById('riders').innerHTML = list.length ? list.map(function (r) {
      var old = Date.now() - r.at > 5 * 60000, b = r.b == null ? '--' : r.b + '%', bc = r.b != null && r.b <= 10 ? 'crit' : r.b != null && r.b <= 25 ? 'low' : '';
      return '<div class="rr' + (r.l ? ' lead' : '') + (old ? ' old' : '') + (r.sos ? ' sos' : '') + '"><span class="dot"></span><div><b>' + esc(r.n) + (r.l ? ' \u00b7 leader' : '') + (r.sos ? ' \u00b7 SOS' : '') + '</b><small>' + (r.s ? r.s + ' km/h \u00b7 ' : '') + 'updated ' + ago(r.at) + '</small></div><div class="bt ' + bc + '">\uD83D\uDD0B ' + b + '</div></div>';
    }).join('') : '<div class="note">Waiting for the first position...</div>';
    var cps = Object.keys(cp).map(function (k) { return cp[k]; }).filter(function (c) { return c && c.at; }).sort(function (a, b) { return a.at - b.at; });
    document.getElementById('cpBox').innerHTML = cps.length ? '<h2 style="margin-top:12px">CHECKPOINTS</h2>' + cps.map(function (c) { return '<div class="cp"><span>' + esc(c.label) + '</span><span>arrived ' + hm(c.at) + '</span></div>'; }).join('') : '';
    if (!fitted && (bounds.length || routeLine)) {
      fitted = true;
      var all = bounds.slice(); if (routeLine) routeLine.getLatLngs().forEach(function (p) { all.push([p.lat, p.lng]); });
      map.fitBounds(L.latLngBounds(all), { paddingTopLeft: [30, 90], paddingBottomRight: [30, window.innerHeight * .45], maxZoom: 15 });
    }
    document.getElementById('upd').textContent = 'Updated ' + hm(Date.now()) + '. Positions refresh about every 15 seconds. ' + (open ? '' : 'This ride has ended.');
  }
  function load() {
    fetch(DB_URL + '/track/' + tok + '.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(draw).catch(function () { document.getElementById('upd').textContent = 'Connection problem -- retrying...'; });
  }
  load(); setInterval(load, 10000);
}
</script>
</body>
</html>
